
[project]
site_name = "Certified Kubernetes Administrator"
site_description = "Documentação e estudos para a certificação CKA"
site_author = "Bruno"
site_url = "https://bsouza-site.github.io/Certified-Kubernetes-Administrator/"

nav = [
  "index.md",
  { "01. Introdução" = "introducao/index.md" },
  { "02. Instalação do kubeadm" = "instalacao-kubeadm/index.md" }
  { "18. Kustomize" = "kustomize/index.md" }
]

extra_css = [
  "stylesheets/extra.css"
]

[project.theme]
variant = "modern"
language = "pt-BR"

features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "content.code.copy",
  "search.suggest",
  "search.highlight"
]

[project.theme.palette]
scheme = "slate"
primary = "indigo"
accent = "cyan"
